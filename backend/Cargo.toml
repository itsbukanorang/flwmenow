[package]
name = "flwmenow-auth"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
argon2 = "0.5"
axum = "0.8"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
